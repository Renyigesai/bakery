plugins {
    id 'fabric-loom' version '1.10.4'
    id 'maven-publish'
}

version = project.mod_version
group = project.mod_group

loom {
    splitEnvironmentSourceSets()
    mixin {
        defaultRefmapName = "bakeries.refmap.json"
        useLegacyMixinAp = true
    }

    mods {
        "bakeries" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        datagen {
            inherit client
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.modid=${project.mod_id}"
            vmArg "-Dfabric-api.datagen.output-dir=${file("build/generated/datagen")}"
            runDir "build/datagen"
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'GB18030'
    options.compilerArgs += ["-Xdiags:verbose","-Xlint:deprecation","-Xdiags:verbose",
                             "-Xmaxerrs", "1000",
                             "-Xmaxwarns", "1000"]
}
repositories {
    maven { url "https://cursemaven.com/" }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Ladysnake Libs"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        url "https://maven.aliyun.com/repository/public"
    }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        name = "BlameJared Maven"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven { url "https://maven.ryanliptak.com/" }

    maven { // Patchouli
        url "https://maven.blamejared.com"
    }
    maven { url = "https://mvn.devos.one/snapshots/" }
    maven {
        url "https://maven2.bai.lol"
        content {
            includeGroup "lol.bai"
            includeGroup "mcp.mobius.waila"
        }
    }
    mavenLocal()
    mavenCentral()
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}+${project.minecraft_version}"
    modCompileOnlyApi "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
    modCompileOnlyApi "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
    modRuntimeOnly "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
}
sourceSets {
    client {
        java {
            srcDirs += ['src/client/java']
        }
    }
    main {
        resources {
            srcDirs = ["src/main/resources"]
        }
    }
}
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "mod_version", project.mod_version
    inputs.property "loader_version", project.loader_version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "displayURL", project.displayURL

    filesMatching("fabric.mod.json") {
        expand(
                mod_version: project.mod_version,
                mod_id: project.mod_id,
                mod_name: project.mod_name,
                mod_description: project.mod_description,
                mod_authors: project.mod_authors,
                mod_license: project.mod_license,
                loader_version: project.loader_version,
                minecraft_version: project.minecraft_version,
                displayURL: project.displayURL
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

tasks.matching { it.name == 'sourcesJar' }.configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named('remapJar').configure {
    archiveBaseName.set(mod_name)
    archiveVersion.set(mod_version)
    archiveClassifier.set("${minecraft_version}-${mod_loader}")

    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_name
            version = mod_version

            artifact(tasks.named('remapJar'))
        }
    }
    repositories {
        maven {
            url = uri("${project.projectDir}/mcmodsrepo")
        }
    }
}
